name: Publish website

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Sync Instagram feed]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      (github.event_name != 'schedule' || vars.GOOGLE_REVIEWS_SYNC_ENABLED == 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Google reviews (read only)
        if: vars.GOOGLE_REVIEWS_SYNC_ENABLED == 'true'
        env:
          GOOGLE_REVIEW_CLIENT_ID: ${{ secrets.GOOGLE_REVIEW_CLIENT_ID }}
          GOOGLE_REVIEW_CLIENT_SECRET: ${{ secrets.GOOGLE_REVIEW_CLIENT_SECRET }}
          GOOGLE_REVIEW_REFRESH_TOKEN: ${{ secrets.GOOGLE_REVIEW_REFRESH_TOKEN }}
          GOOGLE_REVIEW_LOCATION: ${{ vars.GOOGLE_REVIEW_LOCATION }}
        run: python scripts/sync_google_reviews.py
      - uses: actions/configure-pages@v5
      - name: Install photo export library
        run: python -m pip install Pillow==12.0.0
      - name: Prepare static website
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          retention-days: 1
      - name: Deploy refreshed site
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 1800000
