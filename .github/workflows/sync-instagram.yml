name: Sync Instagram feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: instagram-feed-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install photo export library
        run: python -m pip install Pillow==12.0.0
      - name: Download current Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_LOGIN_MODE: ${{ vars.INSTAGRAM_LOGIN_MODE }}
          INSTAGRAM_EXPECTED_USERNAME: thebalddude.dng
        run: python scripts/sync_instagram.py
      - name: Publish updated feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A instagram-feed.json assets
          if git diff --cached --quiet; then
            echo "Instagram feed is already current."
          else
            git commit -m "Refresh Instagram feed"
            git push
          fi
